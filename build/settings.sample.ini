; Rename this file to settings.ini to use these settings.
; If you do not provide settings.ini, the program creates a default one on first run.
;
; Folder containing wallpaper images. Relative paths use the executable folder.
; An empty or unavailable folder falls back to the current working folder.
; Example: C:\Users\Example\Pictures\Wallpapers
source_directory=C:\Users\Example\Pictures\Wallpapers
;
; Last selected image. The program updates this value automatically.
last_image=
;
; Change wallpapers once when the program starts: true or false.
change_on_start=true
