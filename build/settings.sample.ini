; Rename this file to settings.ini to use these settings.
; If you do not provide settings.ini, the program creates a default one on first run.
;
; Add one source_directories entry per folder. Folders are scanned in list order.
; Relative paths use the executable folder. Prefix a path with - to disable it.
; If no folders are enabled, the current working folder is used.
source_directories=C:\Users\Example\Pictures\Wallpapers
source_directories=-D:\SeasonalWallpapers
;
; Last selected image identity. The program updates this value automatically; do not edit it.
last_image=
; Current playlist image per connected display. The program updates these values automatically.
; Do not edit them; they are used to highlight the images currently shown on each display.
; display_image=\\?\DISPLAY#ABC|C:\Users\Example\Pictures\Wallpapers\wallpaper2.jpg
;
; Change wallpapers once when the program starts: true or false.
change_on_start=true
; Open the Settings window when the program starts: true or false.
open_window_on_start=false
; Start the program with the current Windows user: true or false.
start_with_windows=false
; Multi-monitor source selection: same_image or separate_images.
multi_monitor_image_mode=separate_images
